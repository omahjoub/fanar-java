name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the declared minimum Java version and the current LTS.
        # Update both entries together when bumping the Java floor or the LTS target.
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify
        # mvn verify transitively invokes:
        #   - maven-compiler-plugin with -Xdoclint:all,-missing (Javadoc quality gate)
        #   - maven-dependency-plugin:analyze-only with failOnWarning=true (undeclared/unused deps)
        #   - jacoco:check
        run: ./mvnw -B verify

      # JaCoCo runs `report` in the `test` phase and `check` in `verify`, so the HTML report
      # exists by the time a coverage gate fails. Upload it on failure so we can pinpoint the
      # missed branch when CI flakes — without this, a 0.99 ratio just tells us "something
      # somewhere is uncovered" with no way to find which line.
      - name: Upload JaCoCo report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-java-${{ matrix.java }}
          path: |
            **/target/site/jacoco/
            **/target/jacoco.exec
          if-no-files-found: ignore
          retention-days: 1

  check-docs:
    name: Check documentation references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No JDK needed — this reads the repository, it does not build it.
      # The script is the same one contributors run locally:
      #   python3 .github/scripts/check-docs.py
      # It resolves targets against `git ls-files`, so a document referencing a file that was
      # never committed fails here rather than 404-ing for the first reader.
      - name: Verify every documentation reference resolves
        run: python3 .github/scripts/check-docs.py

  check-build:
    name: Check build invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the POMs and the shipped metadata as data — no JDK, no build. Same script a
      # contributor runs locally:
      #   python3 .github/scripts/check-build-invariants.py
      # Guards three things a green build otherwise hides: a published module missing from the BOM
      # (which shipped broken for five months), a class named as a string in META-INF/services or
      # the GraalVM metadata that no longer resolves, and a published module opting out of the
      # coverage gate.
      - name: Verify build invariants
        run: python3 .github/scripts/check-build-invariants.py
